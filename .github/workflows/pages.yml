name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/holdem-game-dev-p3ac7m]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 핸드 평가기 / 엔진 테스트
        run: |
          node tests/evaluator.test.js
          node tests/engine.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pages 설정 (미활성 시 자동 활성화)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 사이트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
