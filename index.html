<!DOCTYPE html>
<html lang="ko" data-quality="high" data-fourcolor="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0620">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="NEON HOLD'EM — 빠르고 화려한 텍사스 홀덤. 캐시 게임, 1:1 헤즈업, 토너먼트, 미션.">
<title>NEON HOLD'EM — 네온 홀덤</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff3cac'/%3E%3Cstop offset='1' stop-color='%232b86c5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<canvas id="fx"></canvas>

<div id="app">
  <!-- ===== 홈 ===== -->
  <section id="screen-home" class="screen active">
    <header class="home-top">
      <button class="profile-chip glass" id="profile-chip">
        <div class="avatar" id="p-avatar">🃏</div>
        <div class="pinfo"><div class="pname"><span id="p-name">플레이어</span> <span class="lvl" id="p-level">Lv.1</span></div><div class="xpbar"><i id="p-xp"></i></div></div>
        <div class="bank"><span class="coin"></span><b id="bank-amt">0</b></div>
      </button>
      <div class="top-btns">
        <button id="btn-missions" class="icon-btn" title="미션">🎯<span class="badge" id="mission-badge"></span></button>
        <button id="btn-settings" class="icon-btn" title="설정">⚙️</button>
      </div>
    </header>
    <div class="hero">
      <h1 class="logo"><span>NEON</span>HOLD'EM</h1>
      <p class="tagline">빠르고 화려한 텍사스 홀덤 · 캐시 · 헤즈업 · 토너먼트</p>
    </div>
    <div class="modes">
      <button class="mode-card cash" data-mode="cash"><div class="mc-art">♠</div><span class="mc-tag">6인 테이블</span><div><h3>퀵 캐시</h3><p>바로 앉아서 바로 승부. 원할 때 정산.</p></div></button>
      <button class="mode-card hu" data-mode="headsup"><div class="mc-art">♥</div><span class="mc-tag">1 : 1</span><div><h3>헤즈업 보스전</h3><p>보스 AI와 정면 승부. 이기면 판돈 2배.</p></div></button>
      <button class="mode-card tour" data-mode="tournament"><div class="mc-art">♦</div><span class="mc-tag">SIT &amp; GO</span><div><h3>토너먼트</h3><p>블라인드 상승 · 생존 경쟁 · 상금 지급.</p></div></button>
    </div>
    <div class="daily-strip" id="daily-strip">
      <div class="ds-head"><span>🎯 <b>오늘의 미션</b></span><span id="daily-date"></span></div>
      <div class="ds-list" id="daily-list"></div>
    </div>
    <div class="home-foot">
      <button class="btn ghost sm" id="btn-ranks">🃏 핸드 랭킹</button>
      <button class="btn ghost sm" id="btn-stats">📊 통계</button>
    </div>
  </section>

  <!-- ===== 게임 ===== -->
  <section id="screen-game" class="screen">
    <div class="game-hud">
      <button id="btn-leave" class="hud-btn" title="나가기">✕</button>
      <div class="hud-info glass"><b id="hud-mode">퀵 캐시</b><span class="sep">|</span><span id="hud-blinds">100/200</span><span class="lvl-tag" id="hud-level"></span></div>
      <div class="hud-right"><span id="hud-hand">#0</span><button id="btn-speed" class="hud-btn" title="속도">▶</button><button id="btn-game-settings" class="hud-btn" title="설정">⚙</button></div>
    </div>
    <div id="table-wrap">
      <div class="table"><div class="table-inner">
        <div class="table-logo">NEON<br>HOLD'EM</div>
        <div id="pot" class="pot"><span class="pot-label">POT</span><b id="pot-amt">0</b></div>
        <div id="board" class="board"></div>
        <div id="side-pots" class="side-pots"></div>
      </div></div>
      <div id="seats"></div>
      <div id="dealer-btn" class="dealer-btn" style="display:none">D</div>
      <div id="fly-layer"></div>
      <div id="banner" class="banner"></div>
    </div>
    <div id="action-bar" class="action-bar hidden">
      <div class="raise-panel glass" id="raise-panel">
        <div class="presets"><button data-preset="min">MIN</button><button data-preset="third">1/3</button><button data-preset="half">1/2</button><button data-preset="pot">POT</button><button data-preset="allin">ALL-IN</button></div>
        <div class="raise-row"><input type="range" id="raise-slider" min="0" max="100" step="1" value="0"><div class="raise-amt" id="raise-amt">0</div></div>
      </div>
      <div class="action-btns" id="action-btns">
        <button id="btn-fold" class="abtn fold">폴드</button>
        <button id="btn-check" class="abtn check">체크</button>
        <button id="btn-raise" class="abtn raise">레이즈</button>
      </div>
      <div class="next-hand" id="next-wrap" style="display:none"><button class="btn cyan">다음 핸드 ▶</button><span class="wait-hint"></span></div>
    </div>
  </section>
</div>
<div id="overlays"></div>
<div id="toasts"></div>

<script src="js/utils.js"></script>
<script src="js/cards.js"></script>
<script src="js/evaluator.js"></script>
<script src="js/perf.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/ai.js"></script>
<script src="js/engine.js"></script>
<script src="js/tournament.js"></script>
<script src="js/profile.js"></script>
<script src="js/missions.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
